name: Maintain Achievement Desk release downloads

# Apply an explicitly requested release-asset rename on main.
on:
  push:
    branches: [main]
    paths: ['release-assets-request.json']

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rename portable ZIP in public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $request = Get-Content release-assets-request.json -Raw | ConvertFrom-Json
          $tag = [string]$request.tag
          if ($tag -ne 'v0.8.1-preview') { throw 'Unexpected release tag.' }
          $old = 'AchievementDesk-0.8.1-preview-Windows.zip'
          $new = 'AchievementDesk-0.8.1-preview-Portable.zip'
          $setup = 'AchievementDesk-0.8.1-preview-Setup.exe'
          if ($request.portable_name -ne $new) { throw 'Unexpected portable file name.' }
          $url = "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $release = (gh api $url | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release.' }
          $asset = $release.assets | Where-Object { $_.name -eq $old } | Select-Object -First 1
          if ($null -ne $asset) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -f "name=$new"
            if ($LASTEXITCODE -ne 0) { throw 'Could not rename portable asset.' }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes.' }
          $updated = (gh api $url | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify updated release.' }
          $remaining = @($updated.assets | ForEach-Object { $_.name })
          $expected = @($setup, $new)
          if (@(Compare-Object $remaining $expected).Count -ne 0) {
            throw "Unexpected release assets: $($remaining -join ', ')"
          }
          Write-Host 'Release now has only Setup.exe and Portable.zip.'
