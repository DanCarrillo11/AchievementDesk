name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['release-request.json']

permissions:
  contents: read

concurrency:
  group: achievementdesk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Validate release metadata
        id: release
        run: python tools/publish_release.py validate
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Build the portable application
        run: python -m PyInstaller --clean --noconfirm AchievementDesk.spec
      - name: Verify frozen runtime and synthetic worker
        run: python tools/verify_packaged.py dist/AchievementDesk
      - name: Package portable and source archives
        run: python tools/package_release.py dist/AchievementDesk release
      - name: Compile Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is missing.' }
          $output = (Resolve-Path release).Path
          $source = Join-Path $output ("AchievementDesk-" + $env:APP_VERSION + "-Portable")
          & $compiler "/DBuildSource=$source" "/DOutputFolder=$output" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Verify clean installation and upgrade from the previous stable release
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force .ci-artifacts | Out-Null
          $previous = Join-Path (Resolve-Path .ci-artifacts).Path 'previous-Setup.exe'
          Invoke-WebRequest 'https://github.com/DanCarrillo11/AchievementDesk/releases/download/v1.0.0/AchievementDesk-1.0.0-Setup.exe' -OutFile $previous
          $expected = 'f2cbdf3b8cd10898e3409d9c1d17a9757b47496de71d77a0e88a452c6d38e0d9'
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Previous installer checksum mismatch.' }
          python tools/verify_packaged.py "release/AchievementDesk-$env:APP_VERSION-Portable" --installer "release/AchievementDesk-$env:APP_VERSION-Setup.exe" --previous-installer $previous
          if ($LASTEXITCODE -ne 0) { throw 'Packaged installation checks failed.' }
      - name: Verify archive privacy and generate checksums
        run: python tools/publish_release.py checksums release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AchievementDesk-release-inputs
          path: |
            release/*-Portable.zip
            release/*-Setup.exe
            release/*-source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: AchievementDesk-release-inputs
          path: release
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py publish release
